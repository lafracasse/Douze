<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Douze — jeu de cartes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#dfeae4; --surface:#f7fbf8; --line:#c4d7ce; --ink:#12302a; --muted:#56706a;
  --accent:#0f7a6c; --accent-ink:#ffffff; --back:#154a42; --back2:#1d5e55; --glow:#f2b632; --danger:#c2453c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1b19; --surface:#142b27; --line:#24423c; --ink:#e2f1ec; --muted:#8eb0a8;
    --accent:#36c2ab; --accent-ink:#06211c; --back:#0f3a34; --back2:#18524a; --glow:#f5c24a; --danger:#ef7a70;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1b19; --surface:#142b27; --line:#24423c; --ink:#e2f1ec; --muted:#8eb0a8;
  --accent:#36c2ab; --accent-ink:#06211c; --back:#0f3a34; --back2:#18524a; --glow:#f5c24a; --danger:#ef7a70;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 18px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}

/* Accueil */
.home{max-width:420px;margin:0 auto;padding:40px 22px 30px;display:flex;flex-direction:column;gap:14px}
.logo{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:64px;line-height:1;margin:0;letter-spacing:-1px;display:flex;gap:6px;align-items:flex-end}
.logo .mini{display:inline-grid;grid-template-columns:repeat(4,10px);gap:3px;margin-left:8px;margin-bottom:10px}
.logo .mini i{width:10px;height:14px;border-radius:3px;display:block}
.tag{margin:0 0 6px;color:var(--muted)}
.fld span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.or{text-align:center;color:var(--muted);font-size:14px}
.join{display:flex;gap:10px}
.join input{text-transform:uppercase;letter-spacing:4px;font-family:Fredoka,system-ui,sans-serif;font-weight:600}
.err{color:var(--danger);min-height:1.4em;margin:0}
.rules{border-top:2px solid var(--line);padding-top:12px;color:var(--muted);font-size:15px}
.rules summary{cursor:pointer;color:var(--ink);font-weight:600}
.rules p{margin:8px 0}

/* Barre */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .code{font-family:Fredoka,system-ui,sans-serif;font-weight:600;letter-spacing:2px}
.bar .grow{flex:1}
.bar .small{font-size:14px;color:var(--muted)}
.iconbtn{border:none;background:none;padding:6px 8px;font-size:15px;color:var(--muted);cursor:pointer;border-radius:10px}

/* Lobby */
.lobby{max-width:420px;margin:0 auto;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center}
.bigcode{font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:58px;letter-spacing:10px;line-height:1}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.plist li{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between}
.plist .you{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}

/* Cartes */
.card{--w:60px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w)*.16);display:grid;place-items:center;
  font-family:Fredoka,system-ui,sans-serif;font-weight:700;font-size:calc(var(--w)*.44);color:#fff;position:relative;
  border:2px solid rgba(255,255,255,.28);box-shadow:0 2px 0 rgba(0,0,0,.2);user-select:none;-webkit-user-select:none;padding:0}
.card.back{background:repeating-linear-gradient(135deg,var(--back) 0 5px,var(--back2) 5px 10px);border-color:rgba(255,255,255,.18)}
.card.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
.card.v-neg{background:#5a3ea6}
.card.v-zero{background:#3a8cd3}
.card.v-low{background:#2c9a58}
.card.v-mid{background:#e2a623;color:#2a1c00}
.card.v-high{background:#d4493f}
.card.tap{cursor:pointer;box-shadow:0 0 0 3px var(--glow),0 2px 0 rgba(0,0,0,.2)}
.card.tap:active{transform:translateY(1px)}
.card.fresh{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.card.fresh{animation:none}}
.card .cnt{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);font-family:system-ui,sans-serif;font-weight:500}

/* Adversaires */
.opps{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 4px;scroll-snap-type:x mandatory}
.opp{flex:0 0 auto;scroll-snap-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.opp.active{border-color:var(--glow)}
.opp .nm{font-size:13px;font-weight:600;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .sc{font-size:12px;color:var(--muted);margin-bottom:6px}
.ogrid{display:grid;grid-template-columns:repeat(4,auto);gap:3px}
.ogrid .card{--w:22px;border-width:1px;box-shadow:none;font-size:11px}

/* Centre */
.center{display:flex;justify-content:center;align-items:flex-start;gap:18px;padding:16px 14px 26px}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .lbl{font-size:13px;color:var(--muted)}
.center .card{--w:min(17vw,66px)}
.hint{text-align:center;margin:0 18px 10px;font-weight:600;min-height:1.5em}
.hint.wait{font-weight:400;color:var(--muted)}
.banner{margin:0 14px 10px;padding:8px 12px;border-radius:12px;background:var(--glow);color:#2a1c00;text-align:center;font-weight:600;font-size:15px}

/* Ma grille */
.mine{padding:4px 14px 28px;display:flex;flex-direction:column;align-items:center}
.mine .head{display:flex;justify-content:space-between;width:100%;max-width:360px;font-size:14px;color:var(--muted);margin-bottom:8px}
.mine .head b{color:var(--ink)}
.mgrid{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.mgrid .card{--w:min(19vw,78px)}
.mine.myturn .head b::after{content:" · à toi";color:var(--accent)}

/* Scores */
.sheet{margin:6px 14px 30px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.sheet h2{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0 0 10px;font-size:24px}
.sheet table{width:100%;border-collapse:collapse;font-size:15px}
.sheet th,.sheet td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
.sheet th:first-child,.sheet td:first-child{text-align:left}
.sheet th{color:var(--muted);font-weight:500;font-size:13px}
.sheet tr.win td{font-weight:700}
.sheet .note{font-size:14px;color:var(--muted);margin:10px 0}
.sheet .btn{width:100%;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
.opp.active .nm{color:var(--accent)}
.ogrid .card{--w:var(--ow,22px);font-size:calc(var(--w)*.48)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.3}
@media (prefers-reduced-motion: no-preference){.dots i{animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}}
@keyframes blink{40%{opacity:1}}
.modal{position:fixed;inset:0;background:rgba(4,14,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:30}
.modal .box{width:100%;max-width:420px;background:var(--surface);border-radius:22px;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.modal h2{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0 0 4px;font-size:24px}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-weight:600;cursor:pointer;font-family:Fredoka,system-ui,sans-serif;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist .rm{border:none;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
(function(){
const app = document.getElementById('app');
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PREFIX = 'douze-v1-';

let myId = LS.get('douze-id');
if(!myId){ myId = 'p' + Math.random().toString(36).slice(2,12); LS.set('douze-id', myId); }
let myName = LS.get('douze-name') || '';

let solo = false;
let peer = null, isHost = false, S = null, code = null, homeMsg = '';
let conns = new Map();          // hôte : connexion -> id joueur
let conn = null, retryT = null, gotState = false, joinTimer = null; // client
let lastSeen = {};

/* ---------- Règles ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newDeck(){
  const d=[];
  for(let i=0;i<5;i++) d.push(-2);
  for(let i=0;i<10;i++) d.push(-1);
  for(let i=0;i<15;i++) d.push(0);
  for(let v=1;v<=12;v++) for(let i=0;i<10;i++) d.push(v);
  return shuffle(d);
}
function mkPlayer(id,name,bot,lvl){ return {id, name, grid:[], total:0, rounds:[], bot:!!bot, lvl:lvl||null}; }
function newGame(c,name){
  return {code:c, status:'lobby', round:0, players:[mkPlayer(myId,name)], deck:[], discard:[],
    turn:0, phase:null, drawn:null, finisher:null, lastLeft:0, nextStarter:null, log:'', lastScores:null, doubled:null, v:0};
}
function deal(s){
  s.deck = newDeck();
  s.players.forEach(p => { p.grid = Array.from({length:12}, () => ({v:s.deck.pop(), up:false, gone:false})); });
  s.discard = [s.deck.pop()];
  s.status = 'setup'; s.phase = null; s.drawn = null; s.finisher = null; s.lastLeft = 0;
  s.round = (s.round||0) + 1; s.log = ''; s.lastScores = null; s.doubled = null;
}
function drawFromDeck(s){
  if(!s.deck.length){ const top = s.discard.pop(); s.deck = shuffle(s.discard); s.discard = [top]; }
  return s.deck.pop();
}
function visibleSum(p){ return p.grid.reduce((a,c)=> a + (c.up && !c.gone ? c.v : 0), 0); }
function upCount(p){ return p.grid.filter(c=>c.up && !c.gone).length; }
function clearColumns(p,s){
  for(let c=0;c<4;c++){
    const cells=[p.grid[c],p.grid[c+4],p.grid[c+8]];
    if(cells.every(x=>x.up && !x.gone) && cells[0].v===cells[1].v && cells[1].v===cells[2].v){
      cells.forEach(x=>{ x.gone=true; s.discard.push(x.v); });
      s.log = p.name + ' élimine une colonne de ' + cells[0].v + '.';
    }
  }
}
function endTurn(s){
  const p = s.players[s.turn];
  clearColumns(p,s);
  const allUp = p.grid.every(c=>c.gone || c.up);
  if(s.finisher==null){
    if(allUp){ s.finisher = s.turn; s.lastLeft = s.players.length - 1; s.log = p.name + ' a tout retourné : dernier tour pour les autres.'; }
  } else s.lastLeft--;
  s.drawn = null;
  if(s.finisher!=null && s.lastLeft<=0){ endRound(s); return; }
  s.turn = (s.turn + 1) % s.players.length;
  s.phase = 'choose';
}
function endRound(s){
  s.players.forEach(p => { p.grid.forEach(c => { if(!c.gone) c.up = true; }); clearColumns(p,s); });
  const scores = s.players.map(p => p.grid.reduce((a,c)=> a + (c.gone?0:c.v), 0));
  const f = s.finisher;
  s.doubled = null;
  if(scores[f] > 0 && scores.some((x,i)=> i!==f && x<=scores[f])){ scores[f] *= 2; s.doubled = f; }
  s.players.forEach((p,i) => { p.rounds.push(scores[i]); p.total += scores[i]; });
  s.lastScores = scores; s.nextStarter = f; s.phase = null; s.drawn = null;
  s.status = s.players.some(p=>p.total>=100) ? 'over' : 'roundEnd';
}
function startPlayIfReady(s){
  if(!s.players.every(p=>upCount(p)>=2)) return;
  let start = s.nextStarter;
  if(start==null || start>=s.players.length){
    let best=-Infinity; start=0;
    s.players.forEach((p,i)=>{ const v=visibleSum(p); if(v>best){ best=v; start=i; } });
  }
  s.status='playing'; s.turn=start; s.phase='choose';
  s.log = s.players[start].name + ' commence.';
}
// Applique l'action du joueur d'index me. Renvoie false si refusée.
function applyAction(s, me, a, i){
  switch(a){
    case 'start': if(s.status!=='lobby' || s.players.length<2) return false; deal(s); return true;
    case 'next': if(s.status!=='roundEnd') return false; deal(s); return true;
    case 'replay': if(s.status!=='over') return false; s.players.forEach(p=>{p.total=0;p.rounds=[];}); s.round=0; s.nextStarter=null; deal(s); return true;
    case 'addbot': if(s.status!=='lobby' || me!==0 || s.players.length>=8) return false; addBot(s, i||'medium'); return true;
    case 'rmbot': { if(s.status!=='lobby' || me!==0) return false; const k=s.players.findIndex(q=>q.id===i && q.bot); if(k<0) return false; s.players.splice(k,1); return true; }
    case 'card': {
      const p = s.players[me]; const c = p.grid[i]; if(!c || c.gone) return false;
      if(s.status==='setup'){ if(c.up || upCount(p)>=2) return false; c.up = true; startPlayIfReady(s); return true; }
      if(s.status!=='playing' || s.turn!==me) return false;
      if(s.phase==='drawn' || s.phase==='fromDiscard'){
        const old = c.v; p.grid[i] = {v:s.drawn, up:true, gone:false}; s.discard.push(old);
        s.log = p.name + ' pose un ' + s.drawn + ' et défausse un ' + old + '.';
        endTurn(s); return true;
      }
      if(s.phase==='mustFlip'){ if(c.up) return false; c.up = true; s.log = p.name + ' jette sa pioche et retourne un ' + c.v + '.'; endTurn(s); return true; }
      return false;
    }
    case 'deck':
      if(s.status!=='playing' || s.turn!==me || s.phase!=='choose') return false;
      s.drawn = drawFromDeck(s); s.phase='drawn'; return true;
    case 'discard':
      if(s.status!=='playing' || s.turn!==me) return false;
      if(s.phase==='choose'){ if(!s.discard.length) return false; s.drawn = s.discard.pop(); s.phase='fromDiscard'; return true; }
      if(s.phase==='drawn'){
        s.discard.push(s.drawn); s.drawn=null;
        if(s.players[me].grid.some(c=>!c.up && !c.gone)) s.phase='mustFlip'; else endTurn(s);
        return true;
      }
      if(s.phase==='fromDiscard'){ s.discard.push(s.drawn); s.drawn=null; s.phase='choose'; return true; }
      return false;
  }
  return false;
}

/* ---------- Robots ---------- */
const BOTNAMES = ['Margaux','Théo','Inès','Hugo','Léa','Nathan','Chloé'];
const LV = {
  easy:   {noise:2.2, count:0, pot:0,    margin:-99, tempo:0.15, give:0,    look:false},
  medium: {noise:1.0, count:1, pot:0.25, margin:1,   tempo:0.45, give:0.25, look:false},
  hard:   {noise:0.4, count:2, pot:0.45, margin:2.5, tempo:0.6,  give:0.45, look:true}
};
const LVNAME = {easy:'Facile', medium:'Moyen', hard:'Fort'};
const LVDESC = {
  easy:'Joue au feeling et fait des erreurs.',
  medium:'Joue correctement et retient les dernières cartes jetées.',
  hard:'Compte les cartes, construit ses colonnes et ne ferme la manche que s’il pense gagner.'
};
function addBot(s,lvl){
  const used = new Set(s.players.map(p=>p.name));
  const name = BOTNAMES.find(n=>!used.has(n)) || ('Robot '+s.players.length);
  s.players.push(mkPlayer('bot-'+Math.random().toString(36).slice(2,8), name, true, LV[lvl]?lvl:'medium'));
}
function gauss(){ let u=0,v=0; while(!u) u=Math.random(); while(!v) v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const FULLC = (()=>{ const m={'-2':5,'-1':10,'0':15}; for(let v=1;v<=12;v++) m[v]=10; return m; })();
// Le robot ne voit que ce qu'un humain voit : cartes retournées et défausse.
function unseen(s,L){
  const cnt = Object.assign({}, FULLC);
  if(L.count===0) return cnt;
  s.players.forEach(p=>p.grid.forEach(c=>{ if(c.up && !c.gone) cnt[c.v]--; }));
  (L.count===2 ? s.discard : s.discard.slice(-3)).forEach(v=>cnt[v]--);
  if(s.drawn!=null) cnt[s.drawn]--;
  for(const k in cnt) if(cnt[k]<0) cnt[k]=0;
  return cnt;
}
function meanCnt(cnt){ let t=0,n=0; for(const k in cnt){ t+=(+k)*cnt[k]; n+=cnt[k]; } return n ? t/n : 5; }
function totalCnt(cnt){ let n=0; for(const k in cnt) n+=cnt[k]; return n||1; }
function colScore(cells,C,L){
  const live = cells.filter(c=>!c.gone); if(!live.length) return 0;
  const up = live.filter(c=>c.up);
  if(up.length===3 && up[0].v===up[1].v && up[1].v===up[2].v) return 0;
  let sum=0; live.forEach(c=>sum += c.up ? c.v : C.E);
  if(L.pot && up.length>=2 && live.length===3 && !C.last){
    const v = up.map(c=>c.v); let a=null;
    if(v[0]===v[1]) a=v[0]; else if(v.length===3 && (v[0]===v[2] || v[1]===v[2])) a=v[2];
    if(a!==null && a>0){ const q=(C.cnt[a]||0)/C.tot; const p=1-Math.pow(1-q,6); sum -= L.pot*p*Math.max(0,sum); }
  }
  return sum;
}
function gridScore(g,C,L){ let t=0; for(let c=0;c<4;c++) t+=colScore([g[c],g[c+4],g[c+8]],C,L); return t; }
function exactSum(g){
  let t=0;
  for(let c=0;c<4;c++){
    const col=[g[c],g[c+4],g[c+8]].filter(x=>!x.gone);
    if(col.length===3 && col.every(x=>x.up) && col[0].v===col[1].v && col[1].v===col[2].v) continue;
    col.forEach(x=>t += x.up ? x.v : 0);
  }
  return t;
}
function estSum(grid,C){ return grid.reduce((a,c)=>a+(c.gone?0:(c.up?c.v:C.E)),0); }
function ctxFor(s,me,L){
  const cnt = unseen(s,L);
  const C = {cnt, tot:totalCnt(cnt), E: L.count===0 ? 5 : meanCnt(cnt), last: s.finisher!=null};
  let oppMin = Infinity;
  s.players.forEach((q,j)=>{
    if(j===me) return;
    const hid = q.grid.filter(c=>!c.up && !c.gone).length;
    oppMin = Math.min(oppMin, estSum(q.grid,C) - (C.last ? 0 : (hid>0 ? 2 : 1)));
  });
  C.oppMin = oppMin;
  C.ahead = estSum(s.players[me].grid,C) < oppMin;
  return C;
}
const isDone = g => g.every(c=>c.gone || c.up);
function finishBonus(mine,C,L){
  const ok = mine<=0 || mine < C.oppMin - L.margin;
  return ok ? 3 + Math.max(0,(C.oppMin-mine)/3) : -30 - Math.max(0, mine-C.oppMin);
}
function givePen(v,L){ return v<=0 ? L.give*(3-v) : v<=3 ? L.give*0.6 : 0; }
function placeOpts(s,me,x,C,L){
  const p=s.players[me], out=[];
  p.grid.forEach((c,i)=>{
    if(c.gone) return;
    const ng=p.grid.slice(); ng[i]={v:x, up:true, gone:false};
    let v = gridScore(p.grid,C,L) - gridScore(ng,C,L);
    if(!C.last){
      if(!c.up) v += C.ahead ? L.tempo : -L.tempo*0.4;
      if(isDone(ng)) v += finishBonus(exactSum(ng),C,L);
    }
    if(c.up) v -= givePen(c.v,L);
    out.push({i, v, kind:'swap'});
  });
  return out;
}
function flipOpts(s,me,x,C,L){
  const p=s.players[me], out=[];
  const hidden = p.grid.filter(c=>!c.up && !c.gone).length;
  p.grid.forEach((c,i)=>{
    if(c.gone || c.up) return;
    let v = C.last ? 0 : (C.ahead ? L.tempo : -L.tempo*0.4);
    const col=i%4, idx=[col,col+4,col+8].filter(k=>k!==i), others=idx.map(k=>p.grid[k]);
    if(others.every(q=>q.up && !q.gone) && others[0].v===others[1].v){
      const a=others[0].v; v += ((C.cnt[a]||0)/C.tot) * (2*a + C.E);
    }
    if(!C.last && hidden===1) v += finishBonus(estSum(p.grid,C),C,L);
    if(x!=null) v -= givePen(x,L);
    out.push({i, v, kind:'flip'});
  });
  return out;
}
function pick(opts,noise){ let b=null; opts.forEach(o=>{ const n=o.v+gauss()*noise; if(!b || n>b.n) b=Object.assign({},o,{n}); }); return b; }
function gapOf(opts){ const v=opts.map(o=>o.v).sort((a,b)=>b-a); return v.length>1 ? v[0]-v[1] : 9; }
const rnd = (a,b) => a + Math.random()*(b-a);
function botPlan(s,me){
  const p=s.players[me]; const L=LV[p.lvl] || LV.medium; const C=ctxFor(s,me,L);
  if(s.phase==='choose'){
    const d = s.discard.length ? s.discard[s.discard.length-1] : null;
    let valA = d!=null ? Math.max(...placeOpts(s,me,d,C,L).map(o=>o.v)) : -Infinity;
    let valB;
    if(L.look){
      let t=0;
      for(const k in C.cnt){
        const n=C.cnt[k]; if(!n) continue; const x=+k;
        const all=placeOpts(s,me,x,C,L).concat(flipOpts(s,me,x,C,L));
        t += n*Math.max(...all.map(o=>o.v));
      }
      valB = t/C.tot;
    } else valB = (L.count===0 ? 1.5 : 1.0) + (C.last ? 0.5 : 0);
    if(d!=null && d<=0) valA += 0.5;
    const close = Math.abs(valA-valB) < 1;
    const takeIt = valA + gauss()*L.noise > valB + gauss()*L.noise*0.6;
    return {a: takeIt ? 'discard' : 'deck', delay: rnd(900,1700) + (close ? rnd(500,1300) : 0)};
  }
  if(s.phase==='fromDiscard'){
    const b=pick(placeOpts(s,me,s.drawn,C,L), L.noise);
    return {a:'card', i:b.i, delay:rnd(700,1300)};
  }
  if(s.phase==='drawn'){
    const all=placeOpts(s,me,s.drawn,C,L).concat(flipOpts(s,me,s.drawn,C,L));
    const b=pick(all, L.noise);
    const delay = rnd(1000,1900) + (gapOf(all)<0.8 ? rnd(400,1100) : 0);
    return b.kind==='swap' ? {a:'card', i:b.i, delay} : {a:'discard', delay};
  }
  if(s.phase==='mustFlip'){
    const b=pick(flipOpts(s,me,null,C,L), L.noise);
    return {a:'card', i:b.i, delay:rnd(500,1000)};
  }
  return null;
}
let botT=null, setupT={};
function clearBots(){ clearTimeout(botT); botT=null; for(const k in setupT) clearTimeout(setupT[k]); setupT={}; }
function scheduleBots(){
  clearTimeout(botT); botT=null;
  if(!isHost || !S) return;
  if(S.status==='setup'){
    S.players.forEach(p=>{
      if(p.bot && upCount(p)<2 && !setupT[p.id])
        setupT[p.id]=setTimeout(()=>{ delete setupT[p.id]; botSetup(p.id); }, rnd(800,2600));
    });
    return;
  }
  if(S.status!=='playing') return;
  const cur=S.players[S.turn]; if(!cur || !cur.bot) return;
  const plan=botPlan(S,S.turn); if(!plan) return;
  const v=S.v, pid=cur.id;
  botT=setTimeout(()=>{ botT=null; if(!S || S.v!==v) return scheduleBots(); hostAction(pid, plan.a, plan.i); }, plan.delay);
}
function botSetup(pid){
  if(!S || S.status!=='setup') return;
  const p=S.players.find(q=>q.id===pid); if(!p || upCount(p)>=2) return;
  const hid=p.grid.map((c,i)=>i).filter(i=>!p.grid[i].up);
  const firstUp=p.grid.findIndex(c=>c.up);
  let i;
  if(firstUp>=0 && Math.random()<0.5){
    const col=firstUp%4; const cand=[col,col+4,col+8].filter(k=>!p.grid[k].up);
    i=cand[Math.floor(Math.random()*cand.length)];
  } else i=hid[Math.floor(Math.random()*hid.length)];
  hostAction(pid,'card',i);
}

/* ---------- Réseau : hôte ---------- */
function publicState(){ const p = Object.assign({}, S); p.deckCount = S.deck.length; delete p.deck; return p; }
function broadcast(){
  const msg = {t:'state', s:publicState()};
  conns.forEach((pid,c) => { if(c.open) try{ c.send(msg); }catch(e){} });
}
function saveHost(){ LS.set(solo?'douze-solo':'douze-host', JSON.stringify(S)); }
function commit(){ S.v = (S.v||0)+1; saveHost(); if(!solo) broadcast(); onState(S); scheduleBots(); }
function hostAction(pid, a, i){
  const me = S.players.findIndex(p=>p.id===pid); if(me<0) return;
  const s = JSON.parse(JSON.stringify(S));
  if(applyAction(s, me, a, i) === false) return;
  S = s; commit();
}
function onHostData(c, d){
  if(!d || typeof d!=='object') return;
  if(d.t==='hello'){
    const pid = String(d.pid||'').slice(0,40), name = String(d.name||'Joueur').slice(0,14);
    if(!pid) return;
    let p = S.players.find(x=>x.id===pid);
    if(!p){
      if(S.status!=='lobby'){ c.send({t:'err', m:'Cette partie a déjà commencé.'}); setTimeout(()=>c.close(),500); return; }
      if(S.players.length>=8){ c.send({t:'err', m:'Partie complète (8 joueurs).'}); setTimeout(()=>c.close(),500); return; }
      S.players.push(mkPlayer(pid,name));
    }
    conns.set(c, pid);
    commit();
    return;
  }
  const pid = conns.get(c); if(!pid) return;
  if(d.t==='act'){ const a=String(d.a); if(a==='addbot'||a==='rmbot') return; hostAction(pid, a, d.i==null?null:+d.i); }
  if(d.t==='leave' && S.status==='lobby'){ S.players = S.players.filter(p=>p.id!==pid); conns.delete(c); commit(); }
}
function startHost(c, restored, tries){
  tries = tries||0;
  isHost = true; code = c;
  if(!restored) S = newGame(c, myName);
  else S = restored;
  saveHost();
  showLoading('Ouverture de la partie…');
  peer = new Peer(PREFIX + c.toLowerCase(), {debug:0});
  peer.on('open', () => { onState(S); });
  peer.on('connection', cn => {
    cn.on('data', d => onHostData(cn, d));
    cn.on('close', () => { conns.delete(cn); });
    cn.on('error', () => { conns.delete(cn); });
  });
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e => {
    if(e.type==='unavailable-id'){
      try{ peer.destroy(); }catch(x){}
      if(!restored){ startHost(genCode(), null, 0); return; }
      if(tries<12){ showLoading('Reprise de la partie… (' + (tries+1) + ')'); setTimeout(()=>startHost(c, S, tries+1), 3000); return; }
      leave('Impossible de reprendre la partie. Crée-en une nouvelle.'); return;
    }
    if(e.type==='network' || e.type==='server-error' || e.type==='socket-error' || e.type==='socket-closed'){ toast('Connexion instable, nouvelle tentative…'); setTimeout(()=>{ try{ peer.reconnect(); }catch(x){} }, 2000); return; }
    if(e.type==='browser-incompatible'){ leave('Ce navigateur ne permet pas de jouer en ligne.'); return; }
  });
}

/* ---------- Réseau : client ---------- */
function startClient(c){
  isHost = false; code = c; gotState = false;
  LS.set('douze-client', c);
  showLoading('Connexion à la partie ' + c + '…');
  peer = new Peer({debug:0});
  peer.on('open', connectHost);
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  peer.on('error', e => {
    if(e.type==='peer-unavailable'){
      if(!gotState){ leave('Aucune partie ouverte avec ce code. Vérifie le code, et que l’hôte a bien la page ouverte.'); return; }
      scheduleRetry(); return;
    }
    if(e.type==='browser-incompatible'){ leave('Ce navigateur ne permet pas de jouer en ligne.'); return; }
    scheduleRetry();
  });
  clearTimeout(joinTimer);
  joinTimer = setTimeout(() => { if(!gotState && code===c) leave('L’hôte ne répond pas. Vérifie le code et réessaie.'); }, 15000);
}
function connectHost(){
  if(!peer || peer.destroyed || isHost) return;
  if(conn){ try{ conn.close(); }catch(e){} }
  conn = peer.connect(PREFIX + code.toLowerCase(), {reliable:true});
  conn.on('open', () => { conn.send({t:'hello', pid:myId, name:myName}); });
  conn.on('data', d => {
    if(!d) return;
    if(d.t==='state'){ gotState = true; clearTimeout(joinTimer); onState(d.s); }
    if(d.t==='err'){ leave(d.m); }
    if(d.t==='closed'){ leave('L’hôte a fermé la partie.'); }
  });
  conn.on('close', scheduleRetry);
  conn.on('error', scheduleRetry);
}
function scheduleRetry(){
  if(isHost || !code || !gotState) return;
  clearTimeout(retryT);
  setBanner('Connexion perdue avec l’hôte, reconnexion…');
  retryT = setTimeout(() => {
    if(peer && peer.disconnected && !peer.destroyed){ try{ peer.reconnect(); }catch(e){} }
    connectHost();
  }, 2500);
}

/* ---------- Actions locales ---------- */
function sendAction(a, i){
  if(!S) return;
  if(isHost) return hostAction(myId, a, i);
  if(conn && conn.open) conn.send({t:'act', a, i});
  else toast('Pas connecté à l’hôte, patiente un instant.');
}
function genCode(){ const L='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=L[Math.floor(Math.random()*L.length)]; return c; }
function createGame(){ if(!readName()) return; startHost(genCode(), null, 0); }
function joinGame(){
  if(!readName()) return;
  const c = (document.getElementById('codeIn').value||'').trim().toUpperCase();
  if(!/^[A-Z]{4}$/.test(c)) return showErr('Le code fait 4 lettres.');
  startClient(c);
}
function leave(msg){
  clearTimeout(retryT); clearTimeout(joinTimer); clearBots();
  if(isHost && !solo && conns.size){ conns.forEach((pid,c)=>{ try{ c.send({t:'closed'}); }catch(e){} }); }
  setTimeout(() => { try{ peer && peer.destroy(); }catch(e){} peer=null; }, isHost ? 300 : 0);
  if(solo) LS.del('douze-solo'); else if(isHost) LS.del('douze-host'); else LS.del('douze-client');
  solo = false; const mo=document.getElementById('modal'); if(mo) mo.remove();
  conns = new Map(); conn = null; S = null; code = null; isHost = false; gotState = false; lastSeen = {};
  homeMsg = msg || '';
  renderHome();
}

function cls(v){ return v<0?'v-neg':v===0?'v-zero':v<=4?'v-low':v<=8?'v-mid':'v-high'; }
const COL = {'v-neg':'#5a3ea6','v-zero':'#3a8cd3','v-low':'#2c9a58','v-mid':'#e2a623','v-high':'#d4493f'};
function cardHTML(c, o){

let prevS = null;
function onState(s){
  const me = s.players.findIndex(p=>p.id===myId);
  if(prevS && me>=0 && s.status==='playing' && s.turn===me && (prevS.turn!==me || prevS.status!=='playing')){
    try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}

function render(){

  }).join('');

  const top = S.discard.length ? {v:S.discard[S.discard.length-1], up:true} : null;
  const canDeck = myTurn && S.phase==='choose';
  const canDiscard = myTurn && ((S.phase==='choose' && top) || S.phase==='drawn' || S.phase==='fromDiscard');
  const discLabel = S.phase==='drawn' && myTurn ? 'Jeter ici' : S.phase==='fromDiscard' && myTurn ? 'Reposer' : 'Défausse';
  const drawnHTML = (S.drawn!=null && S.status==='playing')
    ? `<div class="pile">${cardHTML({v:S.drawn,up:true},{})}<span class="lbl">${S.phase==='fromDiscard'?'Prise':'Piochée'}</span></div>` : '';

  } else if(S.status==='playing'){

           : S.phase==='fromDiscard' ? 'Choisis la carte de ta grille à remplacer.'
           : 'Retourne une de tes cartes cachées.';
    } else {

        ? cur.name + (S.phase==='drawn' ? ' regarde la carte piochée…' : S.phase==='fromDiscard' ? ' place la carte de la défausse…' : S.phase==='mustFlip' ? ' choisit une carte à retourner…' : ' réfléchit…')

  let mine = '';

      return cardHTML(c,{tap, act:tap?'card':null, i, fresh:isFresh(P.id,i,c)});
    }).join('');
    mine = `<section class="mine${myTurn?' myturn':''}"><div class="head"><b>${esc(P.name)}</b><span>visible ${visibleSum(P)} · total ${P.total}</span></div><div class="mgrid">${cells}</div></section>`;
  }

  let sheet='';
  if(S.status==='roundEnd' || S.status==='over'){
    const rows = S.players.map((p,i)=>({p,i,r:(S.lastScores||[])[i]})).sort((a,b)=>a.p.total-b.p.total);
    const best = rows[0].p.total;
    const nWin = rows.filter(x=>x.p.total===best).length;
    const tr = rows.map(x=>`<tr class="${S.status==='over'&&x.p.total===best?'win':''}"><td>${esc(x.p.name)}${x.i===me?' (toi)':''}</td><td>${x.r!=null?x.r:''}${S.doubled===x.i?' ×2':''}</td><td>${x.p.total}</td></tr>`).join('');
    const dbl = S.doubled!=null ? `<p class="note">Le score de ${esc(S.players[S.doubled].name)} est doublé : il a fini sans avoir le plus petit score.</p>` : '';
    const winners = rows.filter(x=>x.p.total===best).map(x=>esc(x.p.name)).join(' et ');
    sheet = `<section class="sheet"><h2>${S.status==='over' ? winners + (nWin>1?' gagnent':' gagne') : 'Fin de la manche ' + S.round}</h2>
      <table><thead><tr><th>Joueur</th><th>Manche</th><th>Total</th></tr></thead><tbody>${tr}</tbody></table>${dbl}
      ${S.status==='over' ? `<button class="btn primary" data-act="replay">Rejouer</button>` : `<button class="btn primary" data-act="next">Manche suivante</button>`}</section>`;
  }

  app.innerHTML = `
    <header class="bar"><button class="iconbtn" data-act="leave">Quitter</button>
      <span class="grow"></span><span class="small">Manche ${S.round}</span>${solo?'':`<span class="code">${esc(S.code)}</span>`}</header>
    <div class="banner" id="netb" hidden></div>
    ${sheet}
    <section class="opps" aria-label="Autres joueurs">${opps}</section>
    ${center}
    ${banner}
    <p class="hint${wait?' wait':''}" aria-live="polite">${esc(hint)}</p>
    ${mine}
    ${log}`;
  lastSeen = seen;
}
function renderLobby(me){
  const list = S.players.map(p=>`<li><span>${p.bot?'🤖 ':''}${esc(p.name)}</span>${p.bot && me===0 ? `<button class="rm" data-act="rmbot" data-id="${esc(p.id)}" aria-label="Retirer ${esc(p.name)}">×</button>` : p.id===myId?'<span class="you">toi</span>':''}</li>`).join('');
  app.innerHTML = `
  <main class="lobby">
    <p class="muted" style="margin:0">Code de la partie</p>
    <div class="bigcode">${esc(S.code)}</div>
    <p class="muted" style="margin:0">Les autres joueurs ouvrent ce même lien et entrent ce code.</p>
    <div class="banner" id="netb" hidden></div>
    <ul class="plist">${list}</ul>
    ${me===0 && S.players.length<8 ? `<button class="btn" data-act="addbot">Ajouter un robot</button>` : ''}
    ${S.players.length>=2 ? `<button class="btn primary" data-act="start">Lancer la partie (${S.players.length} joueurs)</button>` : `<p class="muted">En attente d’au moins un autre joueur…</p>`}
    ${isHost ? `<p class="muted" style="font-size:14px">Garde cette page ouverte jusqu’à la fin de la partie.</p>` : ''}
    <button class="btn" data-act="quitlobby">Quitter</button>
  </main>`;
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act;
  if(a==='cancel'){ leave(); return; }
  if(a==='solo'){ if(readName()) openSolo(); return; }
  if(a==='solon'){ soloCfg.n=+b.dataset.n; b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); return; }
  if(a==='sololvl'){ soloCfg.lvl=b.dataset.l; b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); const d=document.getElementById('lvldesc'); if(d) d.textContent=LVDESC[soloCfg.lvl]; return; }
  if(a==='solostart'){ const m=document.getElementById('modal'); if(m) m.remove(); startSolo(soloCfg.n, soloCfg.lvl); return; }
  if(a==='closemodal'){ const m=document.getElementById('modal'); if(m) m.remove(); return; }
  if(a==='rmbot'){ sendAction('rmbot', b.dataset.id); return; }
  if(a==='addbot'){ sendAction('addbot', 'medium'); return; }
  if(a==='leave'){
    const msg = solo ? 'Quitter la partie contre les robots ?' : isHost ? 'Quitter ? La partie s’arrêtera pour tout le monde.' : 'Quitter cette partie ?';
    if(confirm(msg)) leave();
    return;
  }
  if(a==='quitlobby'){ if(!isHost && conn && conn.open){ try{ conn.send({t:'leave'}); }catch(x){} } leave(); return; }
  sendAction(a, b.dataset.i!=null ? +b.dataset.i : null);
});

/* ---------- Démarrage ---------- */
function init(){
  const so = LS.get('douze-solo');
  if(so){ try{ const s=JSON.parse(so); if(s && s.players && s.players[0] && s.players[0].id===myId){ startSolo(0,null,s); return; } }catch(e){} LS.del('douze-solo'); }
  if(typeof Peer==='undefined'){ renderHome(); showErr('Le module réseau n’a pas pu se charger. Vérifie ta connexion et recharge la page.'); return; }
  const h = LS.get('douze-host');
  if(h){ try{ const s = JSON.parse(h); if(s && s.code && s.players && s.players.some(p=>p.id===myId)){ startHost(s.code, s, 0); return; } }catch(e){} LS.del('douze-host'); }
  const c = LS.get('douze-client');
  if(c && myName){ startClient(c); return; }
  renderHome();
}
init();
})();
</script>
